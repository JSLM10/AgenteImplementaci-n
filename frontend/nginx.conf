server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicación usa rutas de React Router (/conversacion/:id, /documentos).
    # Sin esta regla, recargar en cualquiera de ellas daría 404: nginx buscaría
    # un archivo que no existe en disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre no cambian nunca; el index sí.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
